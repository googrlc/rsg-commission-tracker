[project]
name = "rsg-finance-api"
version = "0.1.0"
description = "Commission API behind the RSG Commission Tracker UI"
requires-python = ">=3.11,<4"

dependencies = [
  # Pinned by commit, not branch: a core change lands here when this app takes
  # it. Published from rsg-hermes via scripts/publish-core.sh.
  "rsg-hermes-core @ git+https://github.com/googrlc/rsg-hermes-core@8a85a2f3964bc45ca23646c9e70ee0fe7b8d0aba",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "python-multipart>=0.0.6",
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rsg-finance-api = "hermes_finance.service:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_finance"]
